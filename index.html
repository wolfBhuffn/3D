<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wolf SaByter - 3D Interactive Turntable Asset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090909;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .scene-container {
      perspective: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Clean Card Container with Subtle Bounded Tilt */
    .TerminalAvatarWidget {
      width: 360px;
      height: 480px;
      background: linear-gradient(135deg, #121212 0%, #1c1c1c 100%);
      border: 1px solid #77736D;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      transform-style: preserve-3d;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(214, 154, 66, 0.08);
      transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
    }

    .box-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: #77736D;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .system-status {
      color: #C51F30;
      animation: pulse 2s infinite;
    }

    .image-viewport {
      width: 100%;
      height: 350px;
      border: 1px dashed #77736D;
      background-color: #0d0d0d;
      border-radius: 4px;
      position: relative;
      transform: translateZ(10px);
      background-image: radial-gradient(circle at 50% 50%, rgba(197, 31, 48, 0.12) 0%, transparent 70%);
      overflow: hidden;
    }

    /* Perfect Dead-Center Alignment for the 3D Model Frames */
    .sculpture-asset {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 85%;
      max-height: 85%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%) translateZ(25px);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      will-change: opacity;
    }

    .sculpture-asset.active {
      opacity: 1;
      visibility: visible;
    }

    .box-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #D69A42;
      font-size: 10px;
      text-align: right;
      letter-spacing: 1.5px;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .angle-tag {
      color: #77736D;
      font-size: 9px;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="TerminalAvatarWidget" id="interactiveCard">
      
      <div class="box-header">
        <span>ASSET // WOLF_SABYTER</span>
        <span class="system-status">● CORE_CONNECTED</span>
      </div>

      <div class="image-viewport" id="viewport">
        <!-- Sequence frames injected dynamically -->
      </div>

      <div class="box-footer">
        <span class="angle-tag" id="angleLabel">FRAME: 001 // VIEW: LEFT PROFILE</span>
        <span id="coordinatesDisplay">SYS.LOC: NY_BRONX_26 // INDEX: 1 / 50</span>
      </div>

    </div>
  </div>

  <script>
    // Full continuous 50-frame sequence extracted directly from your manifest
    const FRAME_SEQUENCE = [

      { id: 12, file: 'wolf_frames/by_view/07_rear-three-quarter-right/f012_rear-three-quarter-right_t04.75s.png', label: 'REAR THREE-QUARTER' },
      { id: 13, file: 'wolf_frames/by_view/07_rear-three-quarter-right/f013_rear-three-quarter-right_t05.25s.png', label: 'REAR THREE-QUARTER' },
      { id: 14, file: 'wolf_frames/by_view/07_rear-three-quarter-right/f014_rear-three-quarter-right_t05.50s.png', label: 'REAR THREE-QUARTER' },
      { id: 15, file: 'wolf_frames/by_view/07_rear-three-quarter-right/f015_rear-three-quarter-right_t05.75s.png', label: 'REAR THREE-QUARTER' },
      { id: 16, file: 'wolf_frames/by_view/08_back/f016_back_t06.00s.png', label: 'BACK' },

      { id: 29, file: 'wolf_frames/by_view/07_rear-three-quarter-right/f029_rear-three-quarter-right_t10.00s.png', label: 'REAR THREE-QUARTER' },
      { id: 30, file: 'wolf_frames/by_view/06_right-profile-with-base/f030_right-profile-with-base_t10.25s.png', label: 'RIGHT PROFILE W/ BASE' },

      { id: 33, file: 'wolf_frames/by_view/02_front/f033_front_t11.00s.png', label: 'FRONT' },

      { id: 35, file: 'wolf_frames/by_view/02_front/f035_front_t12.25s.png', label: 'FRONT' },
      { id: 36, file: 'wolf_frames/by_view/02_front/f036_front_t12.50s.png', label: 'FRONT' },
      { id: 37, file: 'wolf_frames/by_view/02_front/f037_front_t12.75s.png', label: 'FRONT' },
      { id: 38, file: 'wolf_frames/by_view/02_front/f038_front_t13.00s.png', label: 'FRONT' },
      { id: 39, file: 'wolf_frames/by_view/02_front/f039_front_t13.50s.png', label: 'FRONT' },
      { id: 40, file: 'wolf_frames/by_view/02_front/f040_front_t13.75s.png', label: 'FRONT' },
      { id: 41, file: 'wolf_frames/by_view/01_front-high-with-base/f041_front-high-with-base_t14.00s.png', label: 'ELEVATED FRONT' },
      { id: 42, file: 'wolf_frames/by_view/01_front-high-with-base/f042_front-high-with-base_t14.25s.png', label: 'ELEVATED FRONT' },
      { id: 43, file: 'wolf_frames/by_view/01_front-high-with-base/f043_front-high-with-base_t14.50s.png', label: 'ELEVATED FRONT' },
      { id: 44, file: 'wolf_frames/by_view/01_front-high-with-base/f044_front-high-with-base_t14.75s.png', label: 'ELEVATED FRONT' },
      { id: 45, file: 'wolf_frames/by_view/01_front-high-with-base/f045_front-high-with-base_t15.00s.png', label: 'ELEVATED FRONT' },
      { id: 46, file: 'wolf_frames/by_view/01_front-high-with-base/f046_front-high-with-base_t16.25s.png', label: 'ELEVATED FRONT' },
      { id: 47, file: 'wolf_frames/by_view/01_front-high-with-base/f047_front-high-with-base_t16.50s.png', label: 'ELEVATED FRONT' },
      { id: 48, file: 'wolf_frames/by_view/01_front-high-with-base/f048_front-high-with-base_t16.75s.png', label: 'ELEVATED FRONT' },
      { id: 49, file: 'wolf_frames/by_view/02_front/f049_front_t17.00s.png', label: 'FRONT' },
      { id: 50, file: 'wolf_frames/by_view/02_front/f050_front_t17.25s.png', label: 'FRONT' }
    ];

    const card = document.getElementById('interactiveCard');
    const viewport = document.getElementById('viewport');
    const coordsDisplay = document.getElementById('coordinatesDisplay');
    const angleLabel = document.getElementById('angleLabel');

    const imageElements = [];

    // Preload all 50 frames into the viewport center
    FRAME_SEQUENCE.forEach((item, index) => {
      const img = document.createElement('img');
      img.src = item.file;
      img.alt = item.label;
      img.className = `sculpture-asset ${index === 0 ? 'active' : ''}`;
      viewport.appendChild(img);
      imageElements.push(img);
    });

    let currentActiveIndex = 0;

    function handlePointerMove(e) {
      const rect = card.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // Normalize pointer inside card bounds (0 to 1)
      const normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const normY = Math.max(-1, Math.min(1, ((clientY - rect.top) / rect.height) * 2 - 1));

      // Limit card tilt strictly to ±6 degrees
      const tiltX = -normY * 6;
      const tiltY = (normX - 0.5) * 12;
      card.style.transform = `rotateX(${tiltX.toFixed(1)}deg) rotateY(${tiltY.toFixed(1)}deg)`;

      // Map horizontal cursor position smoothly across ALL 50 frames
      const targetIndex = Math.min(
        FRAME_SEQUENCE.length - 1,
        Math.floor(normX * FRAME_SEQUENCE.length)
      );

      if (targetIndex !== currentActiveIndex) {
        imageElements[currentActiveIndex].classList.remove('active');
        currentActiveIndex = targetIndex;
        imageElements[currentActiveIndex].classList.add('active');

        const currentFrame = FRAME_SEQUENCE[currentActiveIndex];
        angleLabel.innerText = `FRAME: ${String(currentFrame.id).padStart(3, '0')} // VIEW: ${currentFrame.label}`;
        coordsDisplay.innerText = `SYS.LOC: NY_BRONX_26 // INDEX: ${currentActiveIndex + 1} / ${FRAME_SEQUENCE.length}`;
      }
    }

    // Event hooks
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove);

    window.addEventListener('mouseleave', () => {
      card.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });
  </script>
</body>
</html>
