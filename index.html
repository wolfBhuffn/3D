<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wolf SaByter - Dynamic 3D Interactive Turntable Asset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090909;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .scene-container {
      perspective: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .TerminalAvatarWidget {
      width: 360px;
      height: 480px;
      background: linear-gradient(135deg, #121212 0%, #1c1c1c 100%);
      border: 1px solid #77736D;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      transform-style: preserve-3d;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(214, 154, 66, 0.08);
      transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
    }

    .box-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: #77736D;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .system-status {
      color: #C51F30;
      animation: pulse 2s infinite;
    }

    .image-viewport {
      width: 100%;
      height: 350px;
      border: 1px dashed #77736D;
      background-color: #0d0d0d;
      border-radius: 4px;
      position: relative;
      transform: translateZ(10px);
      background-image: radial-gradient(circle at 50% 50%, rgba(197, 31, 48, 0.12) 0%, transparent 70%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sculpture-asset {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 85%;
      max-height: 85%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%) translateZ(25px);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      will-change: opacity;
    }

    .sculpture-asset.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-overlay {
      position: absolute;
      color: #D69A42;
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
    }

    .box-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #D69A42;
      font-size: 10px;
      text-align: right;
      letter-spacing: 1.5px;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .angle-tag {
      color: #77736D;
      font-size: 9px;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="TerminalAvatarWidget" id="interactiveCard">
      
      <div class="box-header">
        <span>ASSET // WOLF_SABYTER</span>
        <span class="system-status" id="coreStatus">● INITIALIZING</span>
      </div>

      <div class="image-viewport" id="viewport">
        <div class="loading-overlay" id="loadingText">LOADING FRAMES...</div>
      </div>

      <div class="box-footer">
        <span class="angle-tag" id="angleLabel">FRAME: --- // VIEW: INITIALIZING</span>
        <span id="coordinatesDisplay">SYS.LOC: NY_BRONX_26 // SYNCING</span>
      </div>

    </div>
  </div>

  <script>
    const card = document.getElementById('interactiveCard');
    const viewport = document.getElementById('viewport');
    const coordsDisplay = document.getElementById('coordinatesDisplay');
    const angleLabel = document.getElementById('angleLabel');
    const coreStatus = document.getElementById('coreStatus');
    const loadingText = document.getElementById('loadingText');

    const BASE_PATH = 'clean_wolf_frames/';
    
    let imageElements = [];
    let exactFiles = [];
    let currentActiveIndex = 0;
    let isInitialized = false;

    async function loadViewer() {
      try {
        // Fetch the auto-generated manifest of all frames
        const response = await fetch('manifest.json');
        exactFiles = await response.json();

        let loadedCount = 0;

        exactFiles.forEach((filename, i) => {
          const img = document.createElement('img');
          img.src = `${BASE_PATH}${filename}`;
          img.alt = filename;
          img.className = `sculpture-asset ${i === 0 ? 'active' : ''}`;

          img.onload = () => {
            loadedCount++;
            if (loadedCount === 1) {
              if (loadingText) loadingText.remove();
              coreStatus.innerText = '● CORE_CONNECTED';
              coreStatus.style.color = '#C51F30';
              isInitialized = true;
              updateDisplay(0);
            }
          };

          viewport.appendChild(img);
          imageElements.push(img);
        });

      } catch (err) {
        console.error('Manifest load error:', err);
        if (loadingText) loadingText.innerText = 'MANIFEST SYNC FAILED';
        coreStatus.innerText = '● ERROR';
      }
    }

    function updateDisplay(index) {
      if (!isInitialized || imageElements.length === 0) return;

      imageElements[currentActiveIndex].classList.remove('active');
      currentActiveIndex = index;
      imageElements[currentActiveIndex].classList.add('active');

      const currentFilename = exactFiles[currentActiveIndex];
      const label = currentFilename.replace(/^\w+_/, '').replace(/\.png$/, '').replace(/_/g, ' ').toUpperCase();

      angleLabel.innerText = `FRAME: ${String(currentActiveIndex + 1).padStart(3, '0')} // VIEW: ${label}`;
      coordsDisplay.innerText = `SYS.LOC: NY_BRONX_26 // INDEX: ${currentActiveIndex + 1} / ${imageElements.length}`;
    }

    function handlePointerMove(e) {
      if (!isInitialized) return;

      const rect = card.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const normY = Math.max(-1, Math.min(1, ((clientY - rect.top) / rect.height) * 2 - 1));

      const tiltX = -normY * 6;
      const tiltY = (normX - 0.5) * 12;
      card.style.transform = `rotateX(${tiltX.toFixed(1)}deg) rotateY(${tiltY.toFixed(1)}deg)`;

      const targetIndex = Math.min(
        imageElements.length - 1,
        Math.floor(normX * imageElements.length)
      );

      if (targetIndex !== currentActiveIndex) {
        updateDisplay(targetIndex);
      }
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove);

    window.addEventListener('mouseleave', () => {
      card.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });

    loadViewer();
  </script>

</body>
</html>
