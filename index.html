<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Wolf SaByter — Interactive Frame Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #090909;
      font-family: "Courier New", Courier, monospace;
    }

    .scene-container {
      width: min(100%, 360px);
      perspective: 1200px;
    }

    .TerminalAvatarWidget {
      width: 100%;
      height: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      background: linear-gradient(135deg, #121212, #1c1c1c);
      border: 1px solid #77736d;
      border-radius: 8px;
      transform-style: preserve-3d;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(214, 154, 66, 0.08);
      transition: transform 100ms cubic-bezier(0.2, 0, 0.2, 1);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      color: #aaa59e;
      font-size: 10px;
      letter-spacing: 1px;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .system-status {
      color: #d69a42;
      animation: pulse 2s infinite;
    }

    .system-status[data-state="ready"] {
      color: #ef5263;
    }

    .system-status[data-state="error"] {
      color: #ff6978;
      animation: none;
    }

    .image-viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at center,
          rgba(197, 31, 48, 0.12),
          transparent 70%
        ),
        #0d0d0d;
      border: 1px dashed #77736d;
      border-radius: 4px;
      transform: translateZ(10px);
      cursor: ew-resize;
    }

    .image-viewport:focus-visible {
      outline: 2px solid #d69a42;
      outline-offset: 4px;
    }

    .sculpture-asset {
      position: absolute;
      inset: 0;
      width: 85%;
      height: 85%;
      margin: auto;
      object-fit: contain;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .sculpture-asset.active {
      visibility: visible;
      opacity: 1;
    }

    .loading-overlay {
      position: absolute;
      z-index: 2;
      max-width: 90%;
      color: #d69a42;
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
    }

    .loading-overlay[hidden] {
      display: none;
    }

    .box-footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #d69a42;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 1px;
      text-align: right;
      overflow-wrap: anywhere;
      transform: translateZ(20px);
      pointer-events: none;
    }

    .angle-tag,
    .source-tag,
    .interaction-hint {
      color: #aaa59e;
      font-size: 9px;
    }

    .load-track {
      height: 2px;
      width: 100%;
      overflow: hidden;
      background: #303030;
    }

    .load-fill {
      width: 100%;
      height: 100%;
      background: #d69a42;
      transform: scaleX(0);
      transform-origin: left;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .TerminalAvatarWidget {
        transition: none;
      }

      .system-status {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="scene-container" id="wolfViewer">
    <div class="TerminalAvatarWidget" id="interactiveCard">

      <div class="box-header">
        <span>ASSET // WOLF_SABYTER</span>

        <span
          class="system-status"
          id="coreStatus"
          data-state="loading"
          role="status"
        >● INITIALIZING</span>
      </div>

      <div
        class="image-viewport"
        id="viewport"
        tabindex="0"
        role="slider"
        aria-label="Wolf SaByter frame"
        aria-orientation="horizontal"
        aria-valuemin="1"
        aria-valuemax="1"
        aria-valuenow="1"
        aria-valuetext="Loading frames"
        aria-disabled="true"
        aria-busy="true"
        aria-describedby="interactionHint"
      >
        <div
          class="loading-overlay"
          id="loadingText"
        >LOADING MANIFEST...</div>
      </div>

      <div class="box-footer">
        <span class="angle-tag" id="angleLabel">
          FRAME: --- // VIEW: INITIALIZING
        </span>

        <span class="source-tag" id="sourceLabel">
          SOURCE: ---
        </span>

        <span id="coordinatesDisplay">
          SYS.LOC: NY_BRONX_26 // SYNCING
        </span>

        <div class="load-track" aria-hidden="true">
          <div class="load-fill" id="loadFill"></div>
        </div>

        <span class="interaction-hint" id="interactionHint">
          HOVER / DRAG TO SCRUB · ← → WHEN FOCUSED
        </span>
      </div>

    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const root = document.getElementById("wolfViewer");
      const card = root.querySelector("#interactiveCard");
      const viewport = root.querySelector("#viewport");
      const coreStatus = root.querySelector("#coreStatus");
      const loadingText = root.querySelector("#loadingText");
      const angleLabel = root.querySelector("#angleLabel");
      const sourceLabel = root.querySelector("#sourceLabel");
      const coordsDisplay = root.querySelector("#coordinatesDisplay");
      const loadFill = root.querySelector("#loadFill");

      const BASE_PATH = "clean_wolf_frames/";
      const MANIFEST_PATH = "manifest.json";
      const LOAD_CONCURRENCY = 6;
      const IMAGE_TIMEOUT = 20000;

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

      const VIEW_LABELS = {
        lt_prof: "LEFT PROFILE",
        "3q_lt": "LEFT THREE-QUARTER",
        front: "FRONT",
        "3q_rt": "RIGHT THREE-QUARTER",
        rt_base: "RIGHT BASE",
        rear_3q_rt: "REAR RIGHT THREE-QUARTER",
        back: "BACK",
        front_high_base: "FRONT HIGH BASE"
      };

      let frames = [];
      let currentIndex = -1;
      let requestedIndex = 0;
      let loadedCount = 0;
      let failedCount = 0;
      let loadingComplete = false;

      let activePointerId = null;
      let pendingPointer = null;
      let animationId = null;

      function parseFilename(filename, index) {
        const match = filename.match(
          /^f(\d+)_(.+)_t(\d+(?:\.\d+)?)s\.png$/i
        );

        if (!match) {
          return {
            number: String(index + 1).padStart(3, "0"),
            label: filename
              .replace(/\.[^.]+$/, "")
              .replace(/_/g, " ")
              .toUpperCase(),
            timestamp: null
          };
        }

        const [, number, rawViewCode, timestamp] = match;
        const viewCode = rawViewCode.toLowerCase();

        return {
          number,
          label:
            VIEW_LABELS[viewCode] ||
            viewCode.replace(/_/g, " ").toUpperCase(),
          timestamp
        };
      }

      function setStatus(text, state) {
        if (coreStatus.textContent !== text) {
          coreStatus.textContent = text;
        }

        coreStatus.dataset.state = state;
      }

      function updateProgress() {
        const total = frames.length;
        const settled = loadedCount + failedCount;
        const progress = total ? settled / total : 0;

        loadFill.style.transform = `scaleX(${progress})`;

        const frameText = currentIndex >= 0
          ? `INDEX: ${currentIndex + 1}/${total}`
          : "SYNCING";

        const loadText = loadingComplete
          ? `READY: ${loadedCount}/${total}`
          : `LOADED: ${loadedCount}/${total}`;

        const failureText = failedCount
          ? ` // FAILED: ${failedCount}`
          : "";

        coordsDisplay.textContent =
          `SYS.LOC: NY_BRONX_26 // ${frameText}` +
          ` // ${loadText}${failureText}`;

        if (currentIndex < 0 && total) {
          loadingText.textContent =
            `LOADING FRAMES... ${settled}/${total}`;
        }
      }

      function showFrame(index) {
        const frame = frames[index];

        if (!frame || frame.state !== "loaded") return;

        if (index !== currentIndex) {
          if (currentIndex >= 0) {
            frames[currentIndex].element.classList.remove("active");
          }

          frame.element.classList.add("active");
          currentIndex = index;
        }

        const { number, label, timestamp } = frame.metadata;

        angleLabel.textContent =
          `FRAME: ${number} // VIEW: ${label}`;

        sourceLabel.textContent = timestamp !== null
          ? `SOURCE: ${timestamp}s`
          : "SOURCE: ---";

        viewport.setAttribute("aria-valuenow", String(index + 1));
        viewport.setAttribute(
          "aria-valuetext",
          `Frame ${index + 1} of ${frames.length}: ${label}`
        );
        viewport.setAttribute("aria-disabled", "false");

        loadingText.hidden = true;
        updateProgress();
      }

      function nearestLoadedIndex(target) {
        let bestIndex = -1;
        let bestDistance = Infinity;

        frames.forEach((frame, index) => {
          if (frame.state !== "loaded") return;

          const distance = Math.abs(index - target);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = index;
          }
        });

        return bestIndex;
      }

      function requestFrame(index) {
        if (!frames.length) return;

        requestedIndex = Math.max(
          0,
          Math.min(frames.length - 1, index)
        );

        const target = frames[requestedIndex];

        if (target.state === "loaded") {
          showFrame(requestedIndex);
          return;
        }

        // Keep the current image while a requested frame loads.
        // If the target failed, use the closest available frame.
        if (currentIndex < 0 || target.state === "failed") {
          const fallback = nearestLoadedIndex(requestedIndex);

          if (fallback >= 0) {
            showFrame(fallback);
          }
        }
      }

      function loadFrame(frame, index) {
        return new Promise((resolve) => {
          const img = frame.element;
          let settled = false;

          const finish = (success) => {
            if (settled) return;
            settled = true;

            clearTimeout(timer);
            img.onload = null;
            img.onerror = null;

            frame.state = success ? "loaded" : "failed";

            if (success) {
              loadedCount++;

              if (currentIndex < 0 || requestedIndex === index) {
                showFrame(index);
              }

              setStatus("● CORE_CONNECTED", "ready");
            } else {
              failedCount++;

              console.warn("Frame failed:", frame.filename);
              requestFrame(requestedIndex);
            }

            updateProgress();
            resolve();
          };

          const timer = setTimeout(
            () => finish(false),
            IMAGE_TIMEOUT
          );

          img.onload = () => finish(true);
          img.onerror = () => finish(false);

          img.src = BASE_PATH + frame.filename
            .split("/")
            .map(encodeURIComponent)
            .join("/");
        });
      }

      async function loadViewer() {
        const controller = new AbortController();

        const manifestTimeout = setTimeout(
          () => controller.abort(),
          15000
        );

        try {
          const response = await fetch(MANIFEST_PATH, {
            signal: controller.signal
          });

          if (!response.ok) {
            throw new Error(`Manifest HTTP ${response.status}`);
          }

          const filenames = await response.json();
          clearTimeout(manifestTimeout);

          if (
            !Array.isArray(filenames) ||
            filenames.length === 0 ||
            !filenames.every(
              name =>
                typeof name === "string" &&
                name.trim().length > 0
            )
          ) {
            throw new Error(
              "Manifest must contain a nonempty array of filenames."
            );
          }

          // Preserve the exact order from manifest.json.
          frames = filenames.map((filename, index) => {
            const img = document.createElement("img");

            img.className = "sculpture-asset";
            img.alt = "";
            img.draggable = false;
            img.setAttribute("aria-hidden", "true");

            viewport.appendChild(img);

            return {
              filename,
              metadata: parseFilename(filename, index),
              element: img,
              state: "pending"
            };
          });

          viewport.setAttribute(
            "aria-valuemax",
            String(frames.length)
          );

          updateProgress();

          // Load the first frame before starting the background queue.
          await loadFrame(frames[0], 0);

          let nextIndex = 1;

          async function worker() {
            while (nextIndex < frames.length) {
              const index = nextIndex++;
              await loadFrame(frames[index], index);
            }
          }

          await Promise.all(
            Array.from(
              {
                length: Math.min(
                  LOAD_CONCURRENCY,
                  frames.length - 1
                )
              },
              () => worker()
            )
          );

          loadingComplete = true;
          viewport.setAttribute("aria-busy", "false");

          if (loadedCount === 0) {
            throw new Error("All frame images failed to load.");
          }

          requestFrame(requestedIndex);

          setStatus(
            failedCount ? "● PARTIAL_SYNC" : "● CORE_CONNECTED",
            "ready"
          );

          updateProgress();
        } catch (error) {
          console.error("Wolf viewer error:", error);

          loadingText.hidden = false;
          loadingText.textContent =
            "SYNC FAILED — CHECK MANIFEST / FRAME PATHS";

          setStatus("● ERROR", "error");

          viewport.setAttribute("aria-busy", "false");
          viewport.setAttribute("aria-disabled", "true");
          viewport.setAttribute(
            "aria-valuetext",
            "Frame loading failed"
          );

          coordsDisplay.textContent =
            "SYS.LOC: NY_BRONX_26 // SYNC FAILED";
        } finally {
          clearTimeout(manifestTimeout);
        }
      }

      function processPointer() {
        animationId = null;

        if (!pendingPointer || !frames.length) return;

        // The wrapper remains stationary while the card tilts.
        const rect = root.getBoundingClientRect();

        const normX = Math.max(
          0,
          Math.min(
            1,
            (pendingPointer.x - rect.left) / rect.width
          )
        );

        const normY = Math.max(
          -1,
          Math.min(
            1,
            ((pendingPointer.y - rect.top) / rect.height) * 2 - 1
          )
        );

        if (!reducedMotion.matches) {
          const tiltX = -normY * 6;
          const tiltY = (normX - 0.5) * 12;

          card.style.transform =
            `rotateX(${tiltX.toFixed(1)}deg) ` +
            `rotateY(${tiltY.toFixed(1)}deg)`;
        }

        requestFrame(
          Math.min(
            frames.length - 1,
            Math.floor(normX * frames.length)
          )
        );
      }

      function queuePointer(event) {
        pendingPointer = {
          x: event.clientX,
          y: event.clientY
        };

        if (animationId === null) {
          animationId = requestAnimationFrame(processPointer);
        }
      }

      function resetTilt() {
        if (animationId !== null) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }

        pendingPointer = null;
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
      }

      root.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary) return;

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        activePointerId = event.pointerId;
        root.setPointerCapture(event.pointerId);

        viewport.focus({ preventScroll: true });
        queuePointer(event);
      });

      root.addEventListener("pointermove", (event) => {
        if (!event.isPrimary) return;

        const isMouseHover =
          event.pointerType === "mouse" &&
          activePointerId === null;

        const isActiveDrag =
          event.pointerId === activePointerId;

        if (isMouseHover || isActiveDrag) {
          queuePointer(event);
        }
      });

      root.addEventListener("pointerleave", () => {
        if (activePointerId === null) {
          resetTilt();
        }
      });

      function endPointer(event) {
        if (event.pointerId !== activePointerId) return;

        // Apply the last queued position before clearing it.
        if (pendingPointer) {
          if (animationId !== null) {
            cancelAnimationFrame(animationId);
          }

          processPointer();
        }

        activePointerId = null;

        if (root.hasPointerCapture(event.pointerId)) {
          root.releasePointerCapture(event.pointerId);
        }

        resetTilt();
      }

      root.addEventListener("pointerup", endPointer);
      root.addEventListener("pointercancel", endPointer);
      root.addEventListener("lostpointercapture", endPointer);

      viewport.addEventListener("keydown", (event) => {
        if (currentIndex < 0) return;

        let target;

        switch (event.key) {
          case "Home":
            target = frames.findIndex(
              frame => frame.state === "loaded"
            );
            break;

          case "End":
            target = frames.length - 1;

            while (
              target >= 0 &&
              frames[target].state !== "loaded"
            ) {
              target--;
            }
            break;

          case "ArrowLeft":
          case "ArrowRight": {
            const direction =
              event.key === "ArrowRight" ? 1 : -1;

            target = currentIndex + direction;

            while (
              target >= 0 &&
              target < frames.length &&
              frames[target].state !== "loaded"
            ) {
              target += direction;
            }
            break;
          }

          default:
            return;
        }

        event.preventDefault();

        if (target >= 0 && target < frames.length) {
          requestFrame(target);
        }
      });

      reducedMotion.addEventListener("change", resetTilt);

      window.addEventListener("blur", () => {
        const pointerId = activePointerId;
        activePointerId = null;

        if (
          pointerId !== null &&
          root.hasPointerCapture(pointerId)
        ) {
          root.releasePointerCapture(pointerId);
        }

        resetTilt();
      });

      loadViewer();
    })();
  </script>
</body>
</html>
